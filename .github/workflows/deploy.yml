name: Ada Tours EN — publish from canonical Astro repository
run-name: EN staging — canonical Ada Tours source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: en-pages
  cancel-in-progress: false
jobs:
  publish:
    # Shared code, layouts, prices and media remain exclusively in adatours.ru.
    uses: alexyakovlev79/adatours.ru/.github/workflows/en-pages-reusable-deploy.yml@feat/english-site-foundation
