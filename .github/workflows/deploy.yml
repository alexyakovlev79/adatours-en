name: Ada Tours EN — publish from canonical Astro repository
run-name: EN staging — canonical Ada Tours source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: en-pages
  cancel-in-progress: false
jobs:
  publish:
    # Refresh staging from canonical main after verified full RU fallback PR #72 (5b942e17).
    # This repository holds only the caller; shared data and prices remain in adatours.ru.
    uses: alexyakovlev79/adatours.ru/.github/workflows/en-pages-reusable-deploy.yml@main
