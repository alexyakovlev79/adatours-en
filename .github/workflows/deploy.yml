name: Ada Tours EN — publish from canonical Astro repository
# EN manual refresh 2026-11-07: preserve canonical RU VIP grouping under translated titles.
# EN manual refresh 2026-11-07: publish latest saved translation snapshot after parser compatibility pin.
run-name: EN staging — canonical Ada Tours source
# EN release request 2026-11-07: publish saved mass translations (review + ready) from staging; noindex, no QA.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: en-pages
  cancel-in-progress: false
jobs:
  refresh-needed:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - name: Skip unchanged EN translation snapshots on hourly schedule
        id: compare
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          publish = os.getenv('GITHUB_EVENT_NAME') != 'schedule'
          info = 'forced by workflow event'
          if not publish:
              try:
                  def fetch_json(url):
                      request=urllib.request.Request(url,headers={
                          'User-Agent':'AdaTours-EN-translation-release',
                          'Accept':'application/vnd.github+json'})
                      with urllib.request.urlopen(request,timeout=12) as response:
                          return json.load(response)
                  prefix='https://api.github.com/repos/alexyakovlev79/adatours.ru/git/ref/heads/'
                  main_sha=fetch_json(prefix+'main')['object']['sha']
                  mass_sha=fetch_json(prefix+'i18n/translation-mass-staging')['object']['sha']
                  receipt=fetch_json('https://alexyakovlev79.github.io/adatours-en/translation-receipt.json')
                  published_main=receipt.get('canonicalSourceSha')
                  published_mass=(receipt.get('massReviewPreviewSnapshot') or {}).get('sha')
                  publish=published_main!=main_sha or published_mass!=mass_sha
                  info='changed snapshot' if publish else 'canonical and translation snapshots unchanged'
              except Exception as exc:
                  publish=True
                  info='receipt unavailable; rebuilding: '+type(exc).__name__
          print(info)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as target:
              target.write('publish='+str(publish).lower()+'\n')
          PY

      - name: List stale English translations in the latest live receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://alexyakovlev79.github.io/adatours-en/translation-receipt.json'
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'AdaTours-EN-source-diagnostic'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  receipt=json.load(response)
              stale=[{'id':x.get('sourceId'),'reason':x.get('reason'),'name':x.get('sourceName'),
                      'collection':x.get('collection'),'source':x.get('sourceFingerprint')}
                     for x in receipt.get('entries',[]) if x.get('status')=='stale']
              print('ADA_STALE_SOURCE_ENTRIES='+json.dumps(stale,ensure_ascii=False))
              print('ADA_TRANSLATION_COUNTS='+json.dumps(receipt.get('counts'),ensure_ascii=False))
          except Exception as exc:
              print('Stale receipt diagnostic unavailable: '+str(exc))
          PY
  publish:
    needs: refresh-needed
    if: needs.refresh-needed.outputs.publish == 'true'
    # Publish immutable saved EN translations; independent editorial QA is deferred.
    uses: alexyakovlev79/adatours.ru/.github/workflows/en-pages-reusable-deploy.yml@main
# EN publish request 2026-11-10: refresh all eligible saved translation packets from the latest staging SHA; retain noindex/RU fallback.
# EN publish request 2026-11-10 #48: include three new completed packets after successful #47 snapshot 21abc4d.
# Publication resumed on explicit owner request 2026-11-10: publish all saved eligible English translations to noindex Pages.
# EN source update 2026-11-10: restore the 11 whitespace-only Tour bodies from canonical c5b356d5883d05bf10394bcba04c0787c8a66e8f, without relaxing per-block SHA checks.
# EN fulltext release 2026-11-12: deploy the 1,412 saved five-text packets from pinned staging, preserving noindex and RU source.
# EN fulltext retry 2026-11-12: safe per-document source and Markdown validation, preserving noindex and original releases.
# EN noindex release 2026-11-12: publish 87 repaired fulltext documents with exact immutable source evidence.
