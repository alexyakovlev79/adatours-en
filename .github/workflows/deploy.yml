name: Ada Tours EN — publish from canonical Astro repository
run-name: EN staging — canonical Ada Tours source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: en-pages
  cancel-in-progress: false
jobs:
  publish:
    # Refresh shared canonical site with owner-authorized noindex preview of saved EN review packages.
    # The shared workflow verifies full routes, accepted fields, all MC/VIP/home card labels and RU fallback.
    # This repository holds only the caller; shared data and prices remain in adatours.ru.
    uses: alexyakovlev79/adatours.ru/.github/workflows/en-pages-reusable-deploy.yml@main
