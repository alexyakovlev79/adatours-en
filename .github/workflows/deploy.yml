name: Ada Tours EN — publish from canonical Astro repository
# EN manual refresh 2026-11-07: preserve canonical RU VIP grouping under translated titles.
# EN manual refresh 2026-11-07: publish latest saved translation snapshot after parser compatibility pin.
run-name: EN staging — canonical Ada Tours source
# EN release request 2026-11-07: publish saved mass translations (review + ready) from staging; noindex, no QA.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: en-pages
  cancel-in-progress: true
jobs:
  refresh-needed:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - name: Skip unchanged EN translation snapshots on hourly schedule
        id: compare
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          publish = os.getenv('GITHUB_EVENT_NAME') != 'schedule'
          info = 'forced by workflow event'
          if not publish:
              try:
                  def fetch_json(url):
                      request=urllib.request.Request(url,headers={
                          'User-Agent':'AdaTours-EN-translation-release',
                          'Accept':'application/vnd.github+json'})
                      with urllib.request.urlopen(request,timeout=12) as response:
                          return json.load(response)
                  prefix='https://api.github.com/repos/alexyakovlev79/adatours.ru/git/ref/heads/'
                  main_sha=fetch_json(prefix+'main')['object']['sha']
                  mass_sha=fetch_json(prefix+'i18n/translation-mass-staging')['object']['sha']
                  receipt=fetch_json('https://alexyakovlev79.github.io/adatours-en/translation-receipt.json')
                  published_main=receipt.get('canonicalSourceSha')
                  published_mass=(receipt.get('massReviewPreviewSnapshot') or {}).get('sha')
                  publish=published_main!=main_sha or published_mass!=mass_sha
                  info='changed snapshot' if publish else 'canonical and translation snapshots unchanged'
              except Exception as exc:
                  publish=True
                  info='receipt unavailable; rebuilding: '+type(exc).__name__
          print(info)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as target:
              target.write('publish='+str(publish).lower()+'\n')
          PY
  publish:
    needs: refresh-needed
    if: ${{ false }} # PAUSED 2026-11-10 by owner's stop instruction; do not publish until expressly resumed
    # Publish immutable saved EN translations; independent editorial QA is deferred.
    uses: alexyakovlev79/adatours.ru/.github/workflows/en-pages-reusable-deploy.yml@main
# EN publish request 2026-11-10: refresh all eligible saved translation packets from the latest staging SHA; retain noindex/RU fallback.
# EN publish request 2026-11-10 #48: include three new completed packets after successful #47 snapshot 21abc4d.
# Emergency pause after user withdrew EN publish request. Release must be explicitly resumed.
